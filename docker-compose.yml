# Aegis RAG — local Docker Compose topology
#
# Infra hostnames match `.env.example` (postgres, redis, qdrant, minio).
# App entrypoints (until the modules land):
#   api:    uvicorn aegis.main:app  (backend/Dockerfile CMD)
#   worker: python -m arq aegis.worker.WorkerSettings  (placeholder — worker.py not yet present)
#
# Profiles:
#   malware — ClamAV (only needed when MALWARE_SCAN_ENABLED=true)

name: aegis

networks:
  aegis:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  local_objects:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      # High host port — local Windows PostgreSQL often occupies 5432/5433.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [aegis]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: aegis-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [aegis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [aegis]
    # Distroless-ish image: no curl/wget — probe TCP + HTTP via bash /dev/tcp.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | head -1 | grep -Eq \"HTTP/[0-9.]+ 200\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [aegis]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: aegis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aegis aegis-dev-secret &&
      mc mb --ignore-existing local/aegis-documents &&
      mc anonymous set none local/aegis-documents &&
      echo 'bucket aegis-documents ready'
      "
    networks: [aegis]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aegis-backend:local
    container_name: aegis-api
    env_file: [.env]
    environment:
      # .env may point at localhost for host-dev; containers must use Compose DNS.
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      LOCAL_STORAGE_PATH: /var/objects
      PUBLIC_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - local_objects:/var/objects
    networks: [aegis]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    # CMD from Dockerfile: uvicorn aegis.main:app --host 0.0.0.0 --port 8000

  worker:
    image: aegis-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      LOCAL_STORAGE_PATH: /var/objects
    command: ["python", "-m", "arq", "aegis.worker.WorkerSettings"]
    volumes:
      - local_objects:/var/objects
    networks: [aegis]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # WorkerSettings in aegis.worker — ingest / reindex / purge jobs.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aegis-frontend:local
    container_name: aegis-frontend
    env_file: [.env]
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    networks: [aegis]
    depends_on:
      api:
        condition: service_healthy

  # Optional malware scanner — enable with: docker compose --profile malware up -d
  clamav:
    profiles: [malware]
    image: clamav/clamav:stable
    container_name: aegis-clamav
    ports:
      - "3310:3310"
    networks: [aegis]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
